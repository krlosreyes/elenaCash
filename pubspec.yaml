name: elenacash_app
description: ElenaCash - Sistema Operativo Financiero Personal
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # ── Navigation ────────────────────────────────────────
  go_router: ^14.2.7

  # ── UI Components ─────────────────────────────────────
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  cached_network_image: ^3.3.1

  # ── Monetization ──────────────────────────────────────
  purchases_flutter: ^10.3.0

  # ── Utils ─────────────────────────────────────────────
  intl: ^0.20.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  package_info_plus: ^8.0.2
  flutter_svg: ^2.0.10+1
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  collection: ^1.18.0
  rxdart: ^0.27.7
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3

  # ── Analytics ─────────────────────────────────────────
  posthog_flutter: ^4.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/images/splash_logo.png
  android: true
  ios: true
